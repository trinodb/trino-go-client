name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test -v -race -timeout 30s ./...
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The integration module has its own go.mod, so every tool runs in both.
        module: ['.', 'integration']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # The tools module pins the linters and their dependencies, so neither
      # go.mod gains a requirement. Bump the versions in tools/go.mod.
      - run: go build -C tools -o $RUNNER_TEMP/bin/ honnef.co/go/tools/cmd/staticcheck golang.org/x/vuln/cmd/govulncheck
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: $RUNNER_TEMP/bin/staticcheck ./...
        working-directory: ${{ matrix.module }}
      - run: $RUNNER_TEMP/bin/govulncheck ./...
        working-directory: ${{ matrix.module }}
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # Plain `go test` only replays the seed corpus; this runs each target as a
      # fuzzer. The integration module needs Docker in TestMain and has no
      # targets, so only the driver module is covered.
      - name: Fuzz every target
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              found=1
              echo "::group::$pkg $target"
              go test "$pkg" -run='^$' -fuzz="^${target}\$" -fuzztime=30s
              echo "::endgroup::"
            done
          done
          test "$found" = 1
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27']
        trino: ['latest', '372']
        spooling: ['coordinator_proxy']
        include:
          - go: '1.27'
            trino: 'latest'
            spooling: 'coordinator_storage_redirect'
          - go: '1.27'
            trino: 'latest'
            spooling: 'worker_proxy'
          - go: '1.27'
            trino: 'latest'
            spooling: 'storage'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test -C integration -v -race -timeout 2m ./... -trino_image_tag=${{ matrix.trino }} -trino_spooling_retrieval_mode=${{ matrix.spooling }}
