connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=/tmp/metastore
hive.security=sql-standard
fs.hadoop.enabled=true
# The worker_proxy retrieval mode shares this directory between the
# coordinator and the worker, since the files a worker writes are moved by
# the coordinator on commit.
hive.temporary-staging-directory-path=/tmp/hive-staging
